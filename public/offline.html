<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | VyaparMedia</title>
    <style>
      :root {
        --bg: #FAFAFA;
        --card-bg: #FFFFFF;
        --text: #1B1B22;
        --text-muted: #71717A;
        --border: #E4E4E7;
        --primary: #2563EB;
        --primary-text: #FFFFFF;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0B0D12;
          --card-bg: #141721;
          --text: #F3F4F6;
          --text-muted: #9CA3AF;
          --border: #232736;
          --primary: #4D88FE;
          --primary-text: #0B0D12;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 16px;
      }

      .card {
        max-width: 440px;
        width: 100%;
        padding: 36px 28px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        text-align: center;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.15);
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .icon-container {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: rgba(37, 99, 235, 0.1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 24px;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .retry-btn {
        width: 100%;
        padding: 12px 20px;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-text);
        font-size: 14px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .retry-btn:hover {
        opacity: 0.92;
      }

      .retry-btn:active {
        transform: scale(0.98);
      }

      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="brand-badge">VyaparMedia</div>
      <div class="icon-container" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
          <line x1="1" y1="1" x2="23" y2="23" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>

      <h1>You are offline</h1>
      <p>
        Network connection is currently unavailable. When connection is restored, your deals and cached wallet data will automatically sync.
      </p>

      <button type="button" class="retry-btn" onclick="checkConnection()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 16h5v5" />
        </svg>
        Retry Connection
      </button>

      <div class="hint">Auto-reloading when network returns...</div>
    </main>

    <script>
      function checkConnection() {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          fetch('/', { method: 'HEAD', cache: 'no-store' })
            .then(() => window.location.reload())
            .catch(() => {
              const btn = document.querySelector('.retry-btn');
              if (btn) {
                btn.textContent = 'Still offline... try again';
                setTimeout(() => {
                  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg> Retry Connection';
                }, 2000);
              }
            });
        }
      }

      window.addEventListener('online', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
